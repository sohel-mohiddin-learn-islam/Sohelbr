<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sohelbr Admin</title>
<style>
:root{--bg:#0b0715;--side:#120a24;--card:#1a1232;--line:#33265c;--tx:#f2eeff;--dim:#a79ccc;--gold:#ffbd1a;--red:#e5484d;--green:#30a46c;--cyan:#3cc8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#3a1450 0,#0b0715 55%) fixed;color:var(--tx);font:15px system-ui,sans-serif}
#app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
aside h1{font-size:17px;margin:0 0 14px;color:var(--gold);letter-spacing:1px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;background:#1d1438;border:1px solid var(--line);border-left:4px solid var(--gold);color:var(--tx);padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:600;letter-spacing:.5px}
nav button.on{background:var(--gold);color:#000}
main{padding:20px;flex:1;max-width:1100px;min-width:0}
h2{margin:0 0 14px;color:var(--gold);letter-spacing:1px}
.card{background:linear-gradient(160deg,#1d1438,#150e29);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
input,select,textarea{background:#0c0818;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button.b{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;margin:8px 6px 0 0;font-weight:600}
button.b.big{background:linear-gradient(180deg,#ffd34d,#ffa800);color:#000}
button.r{background:var(--red)}button.g{background:#44368a}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--dim);font-size:12px;text-transform:uppercase}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#33265c}.on{color:var(--green)}.off{color:var(--red)}
.hexes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.hx{width:74px;height:64px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#6b6f80;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;padding:6px;color:#fff}.hx.rare{background:#d99a1a;color:#000;width:88px;height:76px}
.gunprev{position:relative;height:90px;margin:10px 0}.gunprev i{position:absolute;display:block}
canvas{width:100%;background:#0a0b17;border-radius:10px;border:1px solid var(--line)}
.dim{color:var(--dim)}#login{text-align:center;padding:60px 16px}
@media(max-width:720px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}aside h1{margin:0 10px 0 0}nav{flex-direction:row;flex-wrap:wrap}nav button{border-left:1px solid var(--line);padding:8px 10px}}
</style></head><body>
<div id="login"><h1>Sohelbr Admin</h1><p class="dim">Sign in with the admin Google account.</p><button class="b" id="signin">Sign in with Google</button><p id="err" class="off"></p></div>
<div id="app" style="display:none">
<aside><h1>SOHELBR ADMIN</h1><nav id="nav"></nav><span style="flex:1"></span><span class="dim" id="who"></span><button class="b g" id="out">Sign out</button></aside>
<main id="main"></main></div>

<script type="module">
// ====== 1. PASTE YOUR GAME'S FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps > Web) ======
const firebaseConfig = { apiKey: "AIzaSyAatdMvRVTpLwbaWTYVnvvKtTt4Mo2udBU", authDomain: "sohelbr-73c46.firebaseapp.com", projectId: "sohelbr-73c46", appId: "1:681296539039:web:1d3941414eb840ed5ee1aa" };
const ADMIN_EMAIL = "sohelsk9032899952@gmail.com";
// ================================================================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
let tab = "store";
const tabs = { store: "Store", luck: "Luck Royale", pass: "Sohel Pass", missions: "Missions", events: "Events", reports: "Reports", bans: "Bans" };
const GUNS = "USP,GLOCK 19,P320,M92FS,M1911,MP5,P90,VECTOR,SCORPION,MP7,M4A1,AK-47,SCAR-L,HK416,FAMAS,AUG A3,QBZ-95,AWM,BARRETT,M200,SVD,R700,G18C,VZ.61,MAC-10,DESERT EAGLE,M500".split(",");
const itemOpts = items => `<option value="">None</option>` + items.map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.kind)})</option>`).join("");
const fmt = ms => ms ? new Date(ms).toLocaleString() : "-";
const toMs = v => v ? new Date(v).getTime() : 0;
const toLocal = ms => { if (!ms) return ""; const d = new Date(ms - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("#signin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $("#err").textContent = e.message);
$("#out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  const ok = u && u.email === ADMIN_EMAIL;
  $("#login").style.display = ok ? "none" : "block"; $("#app").style.display = ok ? "block" : "none";
  if (u && !ok) { $("#err").textContent = "This account is not the admin."; signOut(auth); }
  if (ok) { $("#who").textContent = u.email; render(); }
});
$("#nav").innerHTML = Object.entries(tabs).map(([k, v]) => `<button data-t="${k}">${v}</button>`).join("");
$("#nav").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };

async function list(c, order) {
  const q = order ? query(collection(db, c), orderBy(order, "desc"), limit(100)) : collection(db, c);
  return (await getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
}
async function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  $("#main").innerHTML = "<p class='dim'>Loading...</p>";
  try { await ({ reports, bans, luck, events, store, pass, missions })[tab](); } catch (e) { $("#main").innerHTML = `<p class="off">${esc(e.message)}</p>`; }
}

// ---------- LUCK ROYALE ----------
async function luck() {
  const rows = await list("luck_items"), shop = await list("store_items");
  $("#main").innerHTML = `
  <div class="card"><b>Add / edit prize</b><p class="dim">Active prizes inside their time window replace the built-in prize table. Leave end empty for no end. Weight = how often it drops (higher = more common).</p>
  <div class="grid"><div><label>Ring name (group, e.g. Diwali Ring)</label><input id="ring" value="Lucky Ring"></div><div><label>Name (shown to players)</label><input id="n"></div><div><label>Gold</label><input id="g" type="number" value="0"></div>
  <div><label>Diamonds</label><input id="d" type="number" value="0"></div><div><label>Weight</label><input id="w" type="number" value="10"></div>
  <div><label>Start</label><input id="s" type="datetime-local"></div><div><label>End</label><input id="e" type="datetime-local"></div>
  <div><label>Also gives item (optional)</label><select id="it">${itemOpts(shop)}</select></div>
  <div><label>Active</label><select id="a"><option value="1">Yes</option><option value="0">No</option></select></div></div>
  <input id="eid" type="hidden"><button class="b" id="save">Save prize</button><button class="b g" id="clr">Clear</button></div>
  ${[...new Set(rows.map(r => r.ring || "Lucky Ring"))].map(rg => `<div class="card"><b>${esc(rg)}</b> <span class="dim">(preview - rarest prizes are the big gold hexagons, max 14 shown in game)</span><div class="hexes">${rows.filter(r => (r.ring || "Lucky Ring") === rg && r.active).sort((a, b) => a.weight - b.weight).slice(0, 14).map((r, i) => `<div class="hx ${i < 4 ? "rare" : ""}">${esc(r.name)}</div>`).join("")}</div></div>`).join("")}
  <div class="card"><table><tr><th>Prize</th><th>Gold</th><th>Dia</th><th>Weight</th><th>Window</th><th></th></tr>
  ${rows.map(r => `<tr><td>${esc(r.name)} <span class="${r.active ? "on" : "off"}">${r.active ? "active" : "off"}</span></td><td>${r.gold}</td><td>${r.dia}</td><td>${r.weight}</td>
  <td class="dim">${fmt(r.start)}<br>${r.end ? fmt(r.end) : "no end"}</td><td><button class="b g" data-edit="${r.id}">Edit</button><button class="b r" data-del="${r.id}">Delete</button></td></tr>`).join("") || "<tr><td class='dim'>No prizes yet - the game uses its built-in table.</td></tr>"}</table></div>`;
  const clear = () => { ["n", "s", "e", "eid"].forEach(i => $("#" + i).value = ""); $("#g").value = 0; $("#d").value = 0; $("#w").value = 10; };
  $("#clr").onclick = clear;
  $("#save").onclick = async () => {
    const data = { name: $("#n").value.trim(), gold: +$("#g").value || 0, dia: +$("#d").value || 0, weight: Math.max(1, +$("#w").value || 1), start: toMs($("#s").value), end: toMs($("#e").value), active: $("#a").value === "1", itemId: $("#it").value, ring: $("#ring").value.trim() || "Lucky Ring" };
    if (!data.name || (!data.gold && !data.dia && !data.itemId)) return alert("Give it a name and some gold, diamonds or an item");
    const id = $("#eid").value; id ? await setDoc(doc(db, "luck_items", id), data) : await addDoc(collection(db, "luck_items"), data); render();
  };
  $("#main").onclick = async e => {
    if (e.target.dataset.del && confirm("Delete this prize?")) { await deleteDoc(doc(db, "luck_items", e.target.dataset.del)); render(); }
    if (e.target.dataset.edit) { const r = rows.find(x => x.id === e.target.dataset.edit); $("#eid").value = r.id; $("#n").value = r.name; $("#g").value = r.gold; $("#d").value = r.dia; $("#w").value = r.weight; $("#s").value = toLocal(r.start); $("#e").value = toLocal(r.end); $("#a").value = r.active ? "1" : "0"; $("#it").value = r.itemId || ""; $("#ring").value = r.ring || "Lucky Ring"; scrollTo(0, 0); }
  };
}

// ---------- EVENTS ----------
async function events() {
  const rows = await list("events"), shop = await list("store_items");
  $("#main").innerHTML = `
  <div class="card"><b>Add / edit event</b><p class="dim">Players see an event only while it is active and between start and end. Each player can claim its reward once.</p>
  <div class="grid"><div><label>Title</label><input id="t"></div><div><label>Description</label><input id="ds"></div><div><label>Gold reward</label><input id="g" type="number" value="0"></div>
  <div><label>Diamond reward</label><input id="d" type="number" value="0"></div><div><label>Start</label><input id="s" type="datetime-local"></div><div><label>End</label><input id="e" type="datetime-local"></div>
  <div><label>Also gives item (optional)</label><select id="it">${itemOpts(shop)}</select></div>
  <div><label>Active</label><select id="a"><option value="1">Yes</option><option value="0">No</option></select></div></div>
  <input id="eid" type="hidden"><button class="b" id="save">Save event</button><button class="b g" id="clr">Clear</button></div>
  <div class="card"><table><tr><th>Event</th><th>Reward</th><th>Window</th><th></th></tr>
  ${rows.map(r => `<tr><td>${esc(r.title)} <span class="${r.active ? "on" : "off"}">${r.active ? "active" : "off"}</span><br><span class="dim">${esc(r.desc)}</span></td><td>${r.gold} gold, ${r.dia} dia</td>
  <td class="dim">${fmt(r.start)}<br>${r.end ? fmt(r.end) : "no end"}</td><td><button class="b g" data-edit="${r.id}">Edit</button><button class="b r" data-del="${r.id}">Delete</button></td></tr>`).join("") || "<tr><td class='dim'>No events yet.</td></tr>"}</table></div>`;
  $("#clr").onclick = () => render();
  $("#save").onclick = async () => {
    const data = { title: $("#t").value.trim(), desc: $("#ds").value.trim(), gold: +$("#g").value || 0, dia: +$("#d").value || 0, start: toMs($("#s").value), end: toMs($("#e").value), active: $("#a").value === "1", itemId: $("#it").value };
    if (!data.title) return alert("Give it a title");
    const id = $("#eid").value; id ? await setDoc(doc(db, "events", id), data) : await addDoc(collection(db, "events"), data); render();
  };
  $("#main").onclick = async e => {
    if (e.target.dataset.del && confirm("Delete this event?")) { await deleteDoc(doc(db, "events", e.target.dataset.del)); render(); }
    if (e.target.dataset.edit) { const r = rows.find(x => x.id === e.target.dataset.edit); $("#eid").value = r.id; $("#t").value = r.title; $("#ds").value = r.desc; $("#g").value = r.gold; $("#d").value = r.dia; $("#s").value = toLocal(r.start); $("#e").value = toLocal(r.end); $("#a").value = r.active ? "1" : "0"; $("#it").value = r.itemId || ""; scrollTo(0, 0); }
  };
}

// ---------- STORE ----------
async function store() {
  const rows = await list("store_items");
  const detail = r => r.kind === "gunskin"
    ? `${esc(r.gun)} <span style="background:${esc(r.body)};padding:0 10px;border-radius:4px">&nbsp;</span> <span style="background:${esc(r.acc)};padding:0 10px;border-radius:4px">&nbsp;</span>`
    : r.kind === "bundle" ? `${(r.contains || "").split(",").filter(Boolean).length} items, +${r.gold || 0} gold, +${r.diaBonus || 0} dia` : "-";
  $("#main").innerHTML = `
  <div class="card"><b>Add / edit store item</b><p class="dim">Types: <b>Gun skin</b> recolours one gun (pick the gun and two colours). <b>Bundle</b> gives several items plus optional gold/diamonds. <b>Other</b> is a collectible/cosmetic name only. Choose "No (prize only)" for items that are only given as Luck Royale / Event prizes.</p>
  <div class="grid"><div><label>Name</label><input id="n"></div>
  <div><label>Type</label><select id="k"><option value="gunskin">Gun skin</option><option value="bundle">Bundle</option><option value="other">Other / outfit</option></select></div>
  <div><label>Price</label><input id="p" type="number" value="100"></div>
  <div><label>Currency</label><select id="c"><option value="g">Gold</option><option value="d">Diamonds</option></select></div>
  <div><label>Show in store</label><select id="sh"><option value="1">Yes</option><option value="0">No (prize only)</option></select></div>
  <div><label>Active</label><select id="a"><option value="1">Yes</option><option value="0">No</option></select></div>
  <div><label>Start</label><input id="s" type="datetime-local"></div><div><label>End</label><input id="e" type="datetime-local"></div></div>
  <div id="gs" class="grid"><div><label>Gun</label><select id="gun">${GUNS.map(g => `<option>${g}</option>`).join("")}</select></div>
  <div><label>Body colour</label><input id="bc" type="color" value="#c0392b"></div><div><label>Accent colour</label><input id="ac" type="color" value="#f1c40f"></div>
  <div class="gunprev"><i id="g1" style="left:0;top:36px;width:34px;height:22px"></i><i id="g2" style="left:30px;top:30px;width:170px;height:32px"></i><i id="g3" style="left:30px;top:30px;width:170px;height:8px"></i><i style="left:200px;top:40px;width:60px;height:8px;background:#222"></i><i style="left:62px;top:62px;width:18px;height:34px;background:#222"></i><i id="g4" style="left:110px;top:62px;width:18px;height:28px"></i></div></div>
  <div id="bd" style="display:none"><div class="grid"><div><label>Bonus gold</label><input id="bg" type="number" value="0"></div><div><label>Bonus diamonds</label><input id="bdm" type="number" value="0"></div></div>
  <label>Items inside the bundle</label>${rows.filter(r => r.kind !== "bundle").map(r => `<label style="color:var(--tx)"><input type="checkbox" class="ct" value="${r.id}" style="width:auto"> ${esc(r.name)} (${esc(r.kind)})</label>`).join("") || "<span class='dim'>Create some items first.</span>"}</div>
  <input id="eid" type="hidden"><button class="b" id="save">Save item</button><button class="b g" id="clr">Clear</button></div>
  <div class="card"><table><tr><th>Item</th><th>Details</th><th>Price</th><th>Window</th><th></th></tr>
  ${rows.map(r => `<tr><td>${esc(r.name)} <span class="${r.active ? "on" : "off"}">${r.active ? "active" : "off"}</span><br><span class="tag">${esc(r.kind)}</span>${r.shop === false ? " <span class='tag'>prize only</span>" : ""}</td>
  <td>${detail(r)}</td><td>${r.price} ${r.currency === "d" ? "dia" : "gold"}</td><td class="dim">${fmt(r.start)}<br>${r.end ? fmt(r.end) : "no end"}</td>
  <td><button class="b g" data-edit="${r.id}">Edit</button><button class="b r" data-del="${r.id}">Delete</button></td></tr>`).join("") || "<tr><td class='dim'>No store items yet.</td></tr>"}</table></div>`;
  const sync = () => { const k = $("#k").value; $("#gs").style.display = k === "gunskin" ? "grid" : "none"; $("#bd").style.display = k === "bundle" ? "block" : "none"; };
  const paint = () => { ["g1", "g2"].forEach(i => $("#" + i).style.background = $("#bc").value); ["g3", "g4"].forEach(i => $("#" + i).style.background = $("#ac").value); };
  $("#bc").oninput = paint; $("#ac").oninput = paint; paint();
  $("#k").onchange = sync; sync(); $("#clr").onclick = () => render();
  $("#save").onclick = async () => {
    const k = $("#k").value;
    const data = { name: $("#n").value.trim(), kind: k, price: +$("#p").value || 0, currency: $("#c").value, shop: $("#sh").value === "1", active: $("#a").value === "1", start: toMs($("#s").value), end: toMs($("#e").value),
      gun: k === "gunskin" ? $("#gun").value : "", body: $("#bc").value, acc: $("#ac").value, gold: k === "bundle" ? +$("#bg").value || 0 : 0, diaBonus: k === "bundle" ? +$("#bdm").value || 0 : 0,
      contains: k === "bundle" ? [...document.querySelectorAll(".ct:checked")].map(x => x.value).join(",") : "" };
    if (!data.name) return alert("Give it a name");
    if (k === "bundle" && !data.contains && !data.gold && !data.diaBonus) return alert("A bundle needs items or a bonus");
    const id = $("#eid").value; id ? await setDoc(doc(db, "store_items", id), data) : await addDoc(collection(db, "store_items"), data); render();
  };
  $("#main").onclick = async e => {
    if (e.target.dataset.del && confirm("Delete this item?")) { await deleteDoc(doc(db, "store_items", e.target.dataset.del)); render(); }
    if (e.target.dataset.edit) {
      const r = rows.find(x => x.id === e.target.dataset.edit);
      $("#eid").value = r.id; $("#n").value = r.name; $("#k").value = r.kind; sync(); $("#p").value = r.price; $("#c").value = r.currency || "g"; $("#sh").value = r.shop === false ? "0" : "1";
      $("#a").value = r.active ? "1" : "0"; $("#s").value = toLocal(r.start); $("#e").value = toLocal(r.end);
      if (r.gun) $("#gun").value = r.gun; $("#bc").value = r.body || "#c0392b"; $("#ac").value = r.acc || "#f1c40f"; $("#bg").value = r.gold || 0; $("#bdm").value = r.diaBonus || 0;
      const ids = (r.contains || "").split(","); document.querySelectorAll(".ct").forEach(x => x.checked = ids.includes(x.value)); scrollTo(0, 0);
    }
  };
}

// ---------- SOHEL PASS ----------
async function pass() {
  const shop = await list("store_items");
  const snap = (await getDocs(collection(db, "config"))).docs.find(d => d.id === "pass");
  const cfg = snap ? snap.data() : {};
  let lv; try { lv = JSON.parse(cfg.levels || "[]"); } catch { lv = []; }
  if (!lv.length) lv = Array.from({ length: 20 }, (_, i) => { const l = i + 1; return { fg: l % 5 ? 50 + 10 * l : 0, fd: l % 5 ? 0 : 10, fi: "", pg: 0, pd: l % 5 ? 5 : 40, pi: "" }; });
  const opt = sel => itemOpts(shop).replace(`value="${sel}"`, `value="${sel}" selected`);
  const prow = (r, n) => `<tr><td>${n}</td><td><input type="number" value="${r.fg || 0}"></td><td><input type="number" value="${r.fd || 0}"></td><td><select>${opt(r.fi || "")}</select></td>
  <td><input type="number" value="${r.pg || 0}"></td><td><input type="number" value="${r.pd || 0}"></td><td><select>${opt(r.pi || "")}</select></td><td><button class="b r rm">x</button></td></tr>`;
  $("#main").innerHTML = `<h2>Sohel Pass</h2>
  <div class="card"><div class="grid"><div><label>Season title</label><input id="pt" value="${esc(cfg.title || "SOHEL PASS")}"></div>
  <div><label>Ends</label><input id="pe" type="datetime-local" value="${toLocal(cfg.end)}"></div>
  <div><label>Premium price (diamonds)</label><input id="pp" type="number" value="${cfg.price || 150}"></div></div>
  <p class="dim">Each level needs 100 pass XP. The LAST level is shown as the big "grand reward" card. Max 30 levels. Rewards can include a store item (skin / bundle).</p></div>
  <div class="card"><table id="pt2"><tr><th>Lv</th><th>FREE gold</th><th>FREE dia</th><th>FREE item</th><th>PREMIUM gold</th><th>PREMIUM dia</th><th>PREMIUM item</th><th></th></tr>
  ${lv.map((r, i) => prow(r, i + 1)).join("")}</table>
  <button class="b g" id="add">+ Add level</button><button class="b" id="save">Save pass</button></div>`;
  const read = () => [...document.querySelectorAll("#pt2 tr")].slice(1).map(tr => { const v = [...tr.querySelectorAll("input,select")].map(x => x.value); return { fg: +v[0] || 0, fd: +v[1] || 0, fi: v[2], pg: +v[3] || 0, pd: +v[4] || 0, pi: v[5] }; });
  $("#add").onclick = () => { if (document.querySelectorAll("#pt2 tr").length > 30) return alert("Max 30 levels"); $("#pt2").insertAdjacentHTML("beforeend", prow({ fg: 50, fd: 0, fi: "", pg: 0, pd: 5, pi: "" }, document.querySelectorAll("#pt2 tr").length)); };
  $("#main").onclick = e => { if (e.target.classList.contains("rm")) { e.target.closest("tr").remove(); [...document.querySelectorAll("#pt2 tr")].slice(1).forEach((tr, i) => tr.firstElementChild.textContent = i + 1); } };
  $("#save").onclick = async () => { await setDoc(doc(db, "config", "pass"), { title: $("#pt").value.trim() || "SOHEL PASS", end: toMs($("#pe").value), price: +$("#pp").value || 150, levels: JSON.stringify(read()) }); alert("Pass saved"); render(); };
}
// ---------- MISSIONS ----------
async function missions() {
  const shop = await list("store_items");
  const snap = (await getDocs(collection(db, "config"))).docs.find(d => d.id === "missions");
  let ms; try { ms = JSON.parse(snap ? snap.data().list : "[]"); } catch { ms = []; }
  const opt = sel => itemOpts(shop).replace(`value="${sel}"`, `value="${sel}" selected`);
  const row = r => `<tr><td><input value="${esc(r.t)}"></td><td><select><option value="matches" ${r.k === "matches" ? "selected" : ""}>Play matches</option><option value="kills" ${r.k === "kills" ? "selected" : ""}>Get kills</option><option value="wins" ${r.k === "wins" ? "selected" : ""}>Win matches</option></select></td>
  <td><input type="number" value="${r.n || 1}"></td><td><select><option value="daily" ${r.p !== "weekly" ? "selected" : ""}>Daily</option><option value="weekly" ${r.p === "weekly" ? "selected" : ""}>Weekly</option></select></td>
  <td><input type="number" value="${r.g || 0}"></td><td><input type="number" value="${r.d || 0}"></td><td><input type="number" value="${r.x ?? 40}"></td><td><select>${opt(r.i || "")}</select></td><td><button class="b r rm">x</button></td></tr>`;
  $("#main").innerHTML = `<h2>Missions</h2><div class="card"><p class="dim">Leave the list empty to use the game's built-in missions. Daily missions reset at midnight, weekly on Monday.</p>
  <table id="mt"><tr><th>Title</th><th>Type</th><th>Goal</th><th>Period</th><th>Gold</th><th>Diamonds</th><th>XP</th><th>Item</th><th></th></tr>${ms.map(row).join("")}</table>
  <button class="b g" id="add">+ Add mission</button><button class="b" id="save">Save missions</button></div>`;
  $("#add").onclick = () => { $("#mt").insertAdjacentHTML("beforeend", row({ t: "New mission", k: "matches", n: 1, p: "daily", g: 50, d: 0, x: 40, i: "" })); };
  $("#main").onclick = e => { if (e.target.classList.contains("rm")) e.target.closest("tr").remove(); };
  $("#save").onclick = async () => {
    const list_ = [...document.querySelectorAll("#mt tr")].slice(1).map(tr => { const v = [...tr.querySelectorAll("input,select")].map(x => x.value); return { t: v[0], k: v[1], n: +v[2] || 1, p: v[3], g: +v[4] || 0, d: +v[5] || 0, x: +v[6] || 0, i: v[7] }; });
    await setDoc(doc(db, "config", "missions"), { list: JSON.stringify(list_) }); alert("Missions saved");
  };
}

// ---------- BANS ----------
async function banPlayer(id, reason, days) {
  await setDoc(doc(db, "bans", id), { reason, active: true, at: Date.now(), until: days > 0 ? Date.now() + days * 86400000 : 0 });
}
async function bans() {
  const rows = await list("bans");
  $("#main").innerHTML = `
  <div class="card"><b>Ban a player by ID</b><div class="grid"><div><label>Player ID (e.g. SB123456)</label><input id="pid"></div><div><label>Reason</label><input id="rs" value="Hacking"></div>
  <div><label>Days (0 = permanent)</label><input id="dy" type="number" value="0"></div></div><button class="b r" id="ban">Ban player</button></div>
  <div class="card"><table><tr><th>Player</th><th>Reason</th><th>Until</th><th></th></tr>
  ${rows.map(r => `<tr><td>${esc(r.id)} <span class="${r.active ? "off" : "on"}">${r.active ? "BANNED" : "lifted"}</span></td><td>${esc(r.reason)}</td><td class="dim">${r.until ? fmt(r.until) : "permanent"}</td>
  <td><button class="b g" data-un="${r.id}">Unban</button></td></tr>`).join("") || "<tr><td class='dim'>Nobody is banned.</td></tr>"}</table></div>`;
  $("#ban").onclick = async () => { const id = $("#pid").value.trim().toUpperCase(); if (!id) return; await banPlayer(id, $("#rs").value, +$("#dy").value || 0); render(); };
  $("#main").onclick = async e => { if (e.target.dataset.un) { await setDoc(doc(db, "bans", e.target.dataset.un), { active: false, reason: "", until: 0, at: Date.now() }); render(); } };
}

// ---------- REPORTS ----------
async function reports() {
  const rows = (await list("reports", "at"));
  const counts = {}; rows.forEach(r => counts[r.reported] = (counts[r.reported] || 0) + 1);
  $("#main").innerHTML = `<div class="card"><table><tr><th>When</th><th>Reported</th><th>By</th><th>Reason</th><th>Status</th><th></th></tr>
  ${rows.map(r => `<tr><td class="dim">${fmt(r.at)}</td><td><b>${esc(r.reported)}</b><br><span class="tag">${counts[r.reported]} report(s)</span></td><td>${esc(r.reporter)}</td><td>${esc(r.reason)}</td>
  <td><span class="tag">${esc(r.status)}</span></td><td><button class="b g" data-open="${r.id}">Inspect</button></td></tr>`).join("") || "<tr><td class='dim'>No reports.</td></tr>"}</table></div><div id="detail"></div>`;
  $("#main").onclick = e => { if (e.target.dataset.open) inspect(rows.find(r => r.id === e.target.dataset.open)); };
}

function inspect(r) {
  let ev; try { ev = JSON.parse(r.evidence); } catch { ev = { samples: [], events: [] }; }
  const S = ev.samples || [], E = ev.events || [];
  const shots = E.filter(x => x[1] === "shot").length, hits = E.filter(x => x[1] === "hit" || x[1] === "kill");
  const heads = hits.filter(x => x[3] === 2).length, kills = E.filter(x => x[1] === "kill").length;
  const acc = shots ? Math.round(hits.length / shots * 100) : 0, hp = hits.length ? Math.round(heads / hits.length * 100) : 0;
  const t0 = S.length ? S[0][0] : 0, t1 = S.length ? S[S.length - 1][0] : 0;
  $("#detail").innerHTML = `<div class="card"><b>Report on ${esc(r.reported)}</b> <span class="dim">reported by ${esc(r.reporter)} - ${esc(r.reason)} - match ${esc(r.match)}</span>
  <div class="grid" style="margin:10px 0"><div class="tag">Shots: ${shots}</div><div class="tag">Hits: ${hits.length}</div><div class="tag">Accuracy: ${acc}%</div><div class="tag">Headshot rate: ${hp}%</div><div class="tag">Kills: ${kills}</div></div>
  <p class="dim">Blue = the reporting player's path, red = nearby enemies. Yellow ticks = shots, green = hits, orange = headshots, red = damage taken. Very high accuracy + headshot rate, or snapping straight to enemies, are signs of aimbot.</p>
  <canvas id="cv" width="900" height="520"></canvas><input type="range" id="sl" min="0" max="${Math.max(0, S.length - 1)}" value="0">
  <div class="dim" id="info"></div>
  <button class="b r" id="b1">Ban 7 days</button><button class="b r" id="b2">Ban permanently</button><button class="b g" id="dm">Dismiss</button></div>`;
  const cv = $("#cv"), c = cv.getContext("2d");
  let xs = [], zs = [];
  S.forEach(s => { xs.push(s[1]); zs.push(s[3]); for (let i = 0; i < s[5].length; i += 2) { xs.push(s[5][i]); zs.push(s[5][i + 1]); } });
  const minx = Math.min(...xs, 0) - 10, maxx = Math.max(...xs, 1) + 10, minz = Math.min(...zs, 0) - 10, maxz = Math.max(...zs, 1) + 10;
  const sc = Math.min(cv.width / (maxx - minx), cv.height / (maxz - minz));
  const X = x => (x - minx) * sc, Z = z => (z - minz) * sc;
  function draw(i) {
    c.clearRect(0, 0, cv.width, cv.height);
    c.strokeStyle = "#4da3ff"; c.lineWidth = 2; c.beginPath(); S.forEach((s, k) => k ? c.lineTo(X(s[1]), Z(s[3])) : c.moveTo(X(s[1]), Z(s[3]))); c.stroke();
    const s = S[i]; if (!s) return;
    c.fillStyle = "#e5484d"; for (let k = 0; k < s[5].length; k += 2) { c.beginPath(); c.arc(X(s[5][k]), Z(s[5][k + 1]), 6, 0, 7); c.fill(); }
    c.fillStyle = "#4da3ff"; c.beginPath(); c.arc(X(s[1]), Z(s[3]), 8, 0, 7); c.fill();
    const a = (s[4] + 180) * Math.PI / 180; c.strokeStyle = "#fff"; c.beginPath(); c.moveTo(X(s[1]), Z(s[3])); c.lineTo(X(s[1]) + Math.sin(a) * 30, Z(s[3]) + Math.cos(a) * 30); c.stroke();
    const near = E.filter(e => Math.abs(e[0] - s[0]) < 0.6);
    $("#info").textContent = `t=${(s[0] - t0).toFixed(1)}s of ${(t1 - t0).toFixed(1)}s   ` + near.map(e => e[1] + (e[1] !== "shot" ? " " + Math.round(e[2]) + " dmg, zone " + e[3] : "")).join(" | ");
    near.forEach((e, k) => { c.fillStyle = e[1] === "shot" ? "#ffd400" : e[1] === "hurt" ? "#e5484d" : (e[3] === 2 ? "#ff8a00" : "#30a46c"); c.fillRect(10 + k * 18, 10, 14, 14); });
  }
  $("#sl").oninput = e => draw(+e.target.value); draw(0);
  const finish = async (status, days) => {
    if (status === "banned") await banPlayer(r.reported, r.reason + " (report " + r.id + ")", days);
    await updateDoc(doc(db, "reports", r.id), { status }); render();
  };
  $("#b1").onclick = () => finish("banned", 7); $("#b2").onclick = () => finish("banned", 0); $("#dm").onclick = () => finish("dismissed", 0);
  scrollTo(0, document.body.scrollHeight);
}
</script></body></html>
